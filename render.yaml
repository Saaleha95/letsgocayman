services:
  - type: web
    name: my-flask-app
    runtime: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-flask-db
          property: connectionString

databases:
  - name: my-flask-db
    region: frankfurt
    plan: free
