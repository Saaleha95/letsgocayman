services:
  - type: web
    name: my-flask-app-eu
    runtime: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-flask-db-eu
          property: connectionString

databases:
  - name: my-flask-db-eu
    region: frankfurt
    plan: free
